apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: core-app-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: core-app
spec:
  groups:
    - name: core-app.rules
      rules:
        - alert: CoreAppPodNotReady
          expr: kube_pod_status_ready{namespace="production",pod=~"core-app-.*",condition="true"} == 0
          for: 1m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: "Pod da aplicacao core-api nao esta pronto"
            description: "O pod {{ $labels.pod }} no namespace production esta ha mais de 1 minuto indisponivel."
