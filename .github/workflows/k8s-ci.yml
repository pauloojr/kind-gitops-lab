name: Kubernetes Manifests CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  validate-and-scan:
    name: Lint, Validate & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: manifests/
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable

      - name: Install Kubeconform
        env:
          KUBECONFORM_VERSION: "v0.6.7"
        run: |
          set -euo pipefail
          curl -sSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
          rm kubeconform.tar.gz
          kubeconform -v

      - name: Run Kubeconform Validation
        run: |
          set -euo pipefail
          kubeconform \
            -strict \
            -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary \
            manifests/core-app/

      - name: Run Trivy IaC/K8s Misconfiguration Scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'config'
          scan-dir: 'manifests/core-app'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'