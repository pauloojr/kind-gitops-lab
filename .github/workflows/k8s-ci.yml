name: Kubernetes Manifests CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  validate-and-scan:
    name: Lint, Validate & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: manifests/
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              new-line-at-end-of-file: disable

      - name: Install Kubeconform
        env:
          KUBECONFORM_VERSION: "v0.6.7"
        run: |
          set -euo pipefail
          curl -sSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
          rm kubeconform.tar.gz
          kubeconform -v

      - name: Run Kubeconform Validation
        run: |
          set -euo pipefail
          kubeconform \
            -strict \
            -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary \
            manifests/core-app/

      - name: Install Trivy CLI
        env:
          TRIVY_VERSION: "0.58.2"
        run: |
          set -euo pipefail
          curl -sSL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/
          rm trivy.tar.gz
          trivy --version

      - name: Run Trivy Misconfiguration Scan
        run: |
          set -euo pipefail
          trivy config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            manifests/core-app/