apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: core-app-monitor
  namespace: production
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: core-app
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: core-app
  endpoints:
    - port: http
      interval: 15s
      path: /metrics
