apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-app-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/pauloojr/kind-gitops-lab.git'
    targetRevision: main
    path: manifests/core-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
