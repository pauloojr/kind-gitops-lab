apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: '[https://prometheus-community.github.io/helm-charts](https://prometheus-community.github.io/helm-charts)'
    chart: kube-prometheus-stack
    targetRevision: 65.8.1
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: '[https://kubernetes.default.svc](https://kubernetes.default.svc)'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
